<!doctype html>
<html lang="en">
<head>
<title>The Daily Crank</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily fishing trivia game from Crank Reports. Nine questions, three depths, one barge.">
<meta property="og:title" content="The Daily Crank">
<meta property="og:description" content="A daily fishing trivia game. How deep can you go?">
<meta property="og:url" content="https://crankreports.com/thedailycrank/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1a2e">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column like a handheld game - pixel scene on top, chunky question card below */
:root{
  --night:#0b1a2e; --panel:#13294a; --panel-2:#1d3d68; --edge:#050d19;
  --ink:#f4f8ff; --muted:#a9bfdd; --sun:#ffcc00; --coral:#ff5a4e; --kelp:#3ccf6e; --roast:#ff4fd8;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --shout:'Bangers',Impact,'Arial Black',sans-serif;
  --body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font:16px/1.4 var(--body)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 clamp(18px,5.4vw,24px)/1 var(--display);color:var(--sun);text-shadow:3px 3px 0 var(--edge);letter-spacing:.02em;margin:0}
.brand small{display:block;font:400 11px/1.4 var(--display);color:var(--muted);text-shadow:none;letter-spacing:.08em;margin-top:6px}
.score{background:var(--edge);border:3px solid var(--sun);padding:6px 10px;text-align:right;min-width:84px}
.score span{display:block;font:400 10px var(--display);color:var(--muted);letter-spacing:.1em}
.score b{font:400 18px var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.stage{position:relative;border:4px solid var(--edge);box-shadow:0 6px 0 var(--edge);background:#5ec4ff;overflow:hidden}
#scene{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:400 clamp(12px,3.6vw,16px) var(--display);
  background:var(--sun);color:var(--edge);padding:5px 10px;border:3px solid var(--edge);white-space:nowrap;letter-spacing:.04em}
.banner.bad{background:var(--coral)}
.roastbox[hidden]{display:none}
.roastbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,13,25,.5);padding:12px}
.roast-text{font:400 clamp(30px,9vw,44px)/1.02 var(--shout);color:var(--roast);letter-spacing:.03em;-webkit-text-stroke:1.5px var(--edge);
  text-shadow:4px 4px 0 var(--edge);text-align:center;margin:0;transform:rotate(-5deg);text-wrap:balance;max-width:92%}
.roastbox.go .roast-text{animation:slam .55s ease-out, wobble 1.4s ease-in-out .55s infinite}
@keyframes slam{0%{opacity:0;transform:scale(3.2) rotate(-20deg)}60%{opacity:1;transform:scale(.9) rotate(-3deg)}100%{transform:scale(1) rotate(-5deg)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-3deg) scale(1.05)}}
.ack{font-size:16px;padding:10px 16px}
.roastbox.go .ack{animation:pop .3s ease-out .45s both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.praise{position:absolute;left:50%;top:40%;margin:0;pointer-events:none;opacity:0;white-space:nowrap;
  font:400 clamp(30px,9vw,44px)/1 var(--shout);color:var(--sun);letter-spacing:.04em;-webkit-text-stroke:1.5px var(--edge);text-shadow:4px 4px 0 var(--edge);transform:translate(-50%,-50%)}
.praise.go{animation:praise 1.5s ease-out forwards}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(6deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg)}
  25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-90%) scale(1) rotate(-2deg)}}
.fatal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.3);opacity:0;transition:opacity 1.4s ease-in;pointer-events:none}
.fatal.on{opacity:1}
.fatal b{font:400 clamp(48px,16vw,88px)/1 var(--shout);color:#d81e1e;letter-spacing:.05em;-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #000;transform:scale(1.25);transition:transform 2.4s ease-out}
.fatal.on b{transform:scale(1)}
.fatal .pts{font:400 clamp(28px,8.5vw,44px)/1 var(--shout);color:var(--sun);letter-spacing:.04em;-webkit-text-stroke:1.5px #000;text-shadow:0 4px 0 #000;opacity:0;transform:scale(.6);transition:opacity .4s ease-out 1.2s, transform .5s cubic-bezier(.2,1.6,.4,1) 1.2s}
.fatal.on .pts{opacity:1;transform:scale(1)}
.score.bump{animation:bump .6s ease-out 3}
@keyframes bump{50%{transform:scale(1.15);background:#3a2a00}}
.fatal small{font:500 15px var(--body);color:#fff;text-shadow:0 2px 0 #000}
#scene{transition:filter 1.4s}
#scene.wasted{filter:grayscale(.9) contrast(1.15) brightness(.8)}
.panel{background:var(--panel);border:4px solid var(--edge);box-shadow:0 6px 0 var(--edge);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.panel h2{font:400 20px/1.2 var(--display);margin:0;color:var(--ink);text-wrap:balance}
.panel p{margin:0}
.eyebrow{font:400 12px var(--display);letter-spacing:.08em;color:var(--sun);text-transform:uppercase}
.muted{color:var(--muted);font-size:14px}
.timer{height:10px;background:var(--edge);border:2px solid var(--edge)}
.timer i{display:block;height:100%;width:100%;background:var(--sun)}
.timer.low i{background:var(--coral)}
.q{font-size:19px;line-height:1.35;font-weight:600;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.opts{grid-template-columns:1fr}}
.opt{font:400 16px/1.25 var(--body);color:var(--ink);background:var(--panel-2);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);
  padding:10px;text-align:left;cursor:pointer;min-height:54px;display:flex;align-items:center;gap:8px;min-width:0}
.opt span:first-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){background:#27508a}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt:disabled{cursor:default}
.opt .mark{margin-left:auto;font:400 18px var(--display)}
.opt.right{background:var(--kelp);color:var(--edge)}
.opt.wrong{background:var(--coral);color:var(--edge)}
.opt.dim{opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.btn{font:400 17px var(--display);background:var(--sun);color:var(--edge);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);padding:13px 18px;cursor:pointer;letter-spacing:.04em}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--muted);font:400 13px var(--display);text-decoration:underline;cursor:pointer;padding:4px;align-self:center}
.feedback{min-height:1.5em;font:600 16px/1.3 var(--body)}
.feedback.good{color:var(--kelp)} .feedback.bad{color:var(--coral)}
/* slider */
.guess{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.guess b{font:400 34px/1 var(--display);color:var(--sun);font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--edge)}
.range{width:100%;accent-color:var(--sun);height:34px;margin:0}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-6px}
.nudge{display:grid;grid-template-columns:56px 1fr 56px;gap:10px}
.nb{font:400 22px var(--display);background:var(--panel-2);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer}
.nb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
/* word */
.clue{font-size:20px}
.word{display:grid;grid-template-columns:1fr auto;gap:10px}
.word input{font:600 20px var(--body);padding:10px 12px;border:3px solid var(--edge);background:#f4f8ff;color:#0b1a2e;min-width:0;border-radius:0}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:34px;font-size:14px;color:var(--muted)}
.chip{font:400 16px var(--body);background:var(--panel-2);color:var(--ink);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);padding:4px 12px;cursor:pointer}
/* bait + results */
.rounds{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rounds li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.rounds b{font:400 13px var(--display);color:var(--sun);letter-spacing:.04em}
.baits{display:flex;flex-direction:column;gap:8px}
.bait{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:left;min-height:46px;padding:8px 10px}
.bait .em{font-size:22px;line-height:1}
.bait .win{font:400 13px var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.bait small{display:block;color:var(--muted);font-size:13px}
.total{display:flex;align-items:baseline;gap:10px}
.total .big{font:400 44px/1 var(--display);color:var(--sun);font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--edge)}
.haul{margin:0;display:flex;flex-direction:column;gap:6px}
.haul div{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:2px dashed #27466f}
.haul dt{font:400 12px var(--display);color:var(--muted);letter-spacing:.06em}
.haul dd{margin:0;min-width:0}
.haul .e{font-size:18px;letter-spacing:1px}
.haul .n{font:400 14px var(--display);font-variant-numeric:tabular-nums}
.share{background:var(--edge);color:var(--ink);padding:12px;margin:0;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-x:auto;user-select:all}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.note select{font:500 13px var(--body);background:var(--panel-2);color:var(--ink);border:2px solid var(--edge);padding:3px 6px;margin-left:4px}
@media (prefers-reduced-motion:reduce){
  .btn:active,.opt:active,.nb:active{transform:none}
  .roastbox.go .roast-text,.roastbox.go .ack{animation:none}
  .fatal b,.fatal .pts{transition:none}
  .score.bump{animation:none}
  .praise.go{animation:fadeonly 1.5s forwards}
  @keyframes fadeonly{0%,70%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}
}
</style>

</head>

  for(const [a,b,c] of ZONES){ if(y>=a && y<=b){ const n=c.length, i=Math.min(n-1, Math.floor((y-a)/((b-a+1)/n))); return c[i]; } }
  return ZONES[2][2][2];
}

const PAL = { small:['#ff7a3d','#ffd23f','#ff5fa2','#9bff5c','#ff9de2'] };
const SIZE = { small:[8,5] };
function makeFish(kind, scale=1, col){
  const [w,h] = SIZE[kind]; const p = PAL[kind];
  return { type:'fish', kind, base:kind, w:Math.round(w*scale), h:Math.round(h*scale)|1,
    col: col || p[Math.floor(Math.random()*p.length)],
    dir: Math.random()<.5?1:-1, x:0, y:0, phase:Math.random()*6, speed:8+Math.random()*12 };
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1,7),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

  const P = (lx,ly,c)=>{ const X = f.dir>0 ? f.x+lx : f.x+(w-1-lx); px(X, f.y+ly, c); };
  const tl = Math.max(2, Math.floor(w/3)), wig = Math.round(Math.sin(f.phase));
  for(let k=1;k<=tl;k++){ const hh = Math.round(k*(h/2)/tl), oy = k>tl/2 ? wig : 0;
    for(let y=-hh;y<=hh;y++) P(-k, Math.round(cy)+y+oy, dark); }
  for(let ix=0;ix<w;ix++) for(let iy=0;iy<h;iy++){
    const dx=(ix+.5-rx)/rx, dy=(iy+.5-ry)/ry;
    if(dx*dx+dy*dy<=1){ let c = f.col; if(iy > cy+ry*.35) c = light; if(ix===Math.floor(w/2)) c = dark; P(ix,iy,c); }
  }
  const mid = Math.floor(w/2);
  for(let i=-1;i<=1;i++) P(mid+i-1, -1, dark);
  const ex = w-3, ey = Math.max(0, Math.round(cy)-1);
  P(ex,ey,'#fff'); P(ex+1,ey,'#fff'); P(ex,ey+1,'#fff'); P(ex+1,ey+1,'#111');
  P(w-1, Math.round(cy)+1, '#3a0d1e');
}

function line(x0,y0,x1,y1,colFn){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let e=dx+dy;
  for(;;){ px(x0,y0,colFn(x0,y0)); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} }
}

    else rect(0,y,W,1,SKY[bi]);
  }

  for(let i=0;i<3;i++){ const rx = 30+i*60 + Math.sin(T*.4+i)*6; for(let y=WY+3;y<76;y+=2) if((y+i)%4===0) px(rx+(y-WY)*.3, y, '#ffffff22'); }

const BX0 = 24, BX1 = 128;
const deckTop = x => WY - 8 + Math.round((x-BX0)*(0.03 + S.sink*0.14) + S.sink*44) + S.bob;
function blob(cx, by, w, h, c, hi){
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dx=(x+.5-w/2)/(w/2), dy=(y+.5-h)/h; if(dx*dx+dy*dy<=1) px(cx-(w>>1)+x, by-h+1+y, c);
  }
  if(hi) px(cx-(w>>2), by-h+2, hi);
}
function drawBarge(){
  const T = S.T;
  S.bob = Math.round(Math.sin(T*1.5)) + (S.shake>.55 && Math.floor(T*28)%2 ? 1 : 0);
  // hull
  for(let x=BX0;x<=BX1;x++){
    const t = deckTop(x);
    for(let y=t; y<=WY+2; y++){
      const r = y-t;
      if((x-BX0) < r-1) continue;              // raked bow
      let c;
      if(r===0){
        if(hsh(x,1)%9===0) c='#2a1a10';
        else if(x%6===0) c='#4a3018';
        else c = Math.floor(x/6)%2 ? '#6e4a28' : '#7a5430';
      } else {
        const n = hsh(x,y);
        c = n<30?'#7a3618': n<60?'#8e4220': n<80?'#a35226':'#5e2a14';
        if(x%17===0) c='#4a200e';
        if(x%11===3 && r<=6) c = r%2 ? '#c06a32' : '#b05a28';
        if(r===3 && x%9===5) c='#d9cfb0';
        if(r===1 && x%4===0) c='#c98a5a';
        if(((x>=70&&x<=78)||(x>=103&&x<=109)) && r>=2 && r<=6) c = (r===2||r===6)&&(x===70||x===78||x===103||x===109) ? '#b0b8c0' : '#7d858e';
        if(r>=2 && hsh(x,r+40)%41===0) c='#120a06';
      }
      px(x,y,c);
    }
  }
  // tire hung on the side
  const tx=54, ty=deckTop(54)+3;
  for(let y=-2;y<=2;y++) for(let x=-2;x<=2;x++){ const d=x*x+y*y; if(d>=2 && d<=5) px(tx+x,ty+y,'#1c1c1c'); }
  px(tx-1,ty-2,'#3a3a3a');
  // water lapping over the low hull
  const sh = Math.floor(T*6);
  for(let x=BX0-2;x<=BX1+2;x++){ px(x, WY+1, (x+sh)%5<3 ? '#45d6f0':'#c8f3ff'); px(x, WY+2, '#45d6f0'); }
  // shack
  const s0 = 30, s1 = 46;
  for(let x=s0;x<=s1;x++){
    const base = deckTop(x)-1;
    for(let r=0;r<10;r++){
      let c = (Math.floor((x-s0)/3)%2) ? '#9a7448' : '#86623a';
      if((x-s0)%3===0) c='#5e4426';
      if(x===41 && r>=3 && r<=6) c='#2a1a10';
      if(x>=33 && x<=36 && r>=5 && r<=7) c = (x===35&&r===6)||(x===34&&r===5) ? '#7fd2ff' : '#1a2a3a';
      if(x>=42 && x<=44 && r<=6) c = '#5a3a1e';
      px(x, base-r, c);
    }
  }
  for(let x=s0-2;x<=s1+2;x++){
    if(x===43||x===44) continue;
    const ry = deckTop(s0)-12 + Math.round((x-s0)*0.12);
    px(x, ry, x%2?'#7d8590':'#5d646d'); px(x, ry+1, x%2?'#5d646d':'#7d8590');
  }
  // stove pipe + smoke
  const pt = deckTop(s0)-12;
  for(let r=1;r<=5;r++){ px(34,pt-r,'#4a4a4a'); px(35,pt-r, r===3?'#a35226':'#3a3a3a'); }
  for(let i=0;i<(S.sink>.2?0:3);i++){
    const ph = (T*.35 + i/3)%1, sx = 35 + ph*12, sy = pt-6 - ph*14, rr = ph<.5?1:2;
    for(let y=-rr;y<=rr;y++) for(let x=-rr;x<=rr;x++) if(x*x+y*y<=rr*rr) px(sx+x, sy+y, ph<.6?'#9aa0a6':'#c4c9ce');
  }
  // garbage pile: big, stacked and stinking
  const bp = S.pile>0 ? -1 : 0, dt0 = x=>deckTop(x)-1+bp;
  [[56,10,6,'#23262b','#4a515a'],[66,11,8,'#2f4a2a','#4f7046'],[77,10,7,'#23262b','#4a515a'],[87,8,5,'#3a3f46','#5a616a'],
   [61,9,6,'#3a3f46','#5a616a'],[72,10,7,'#23262b','#4a515a'],[82,8,6,'#2f4a2a','#4f7046']].forEach(([cx,w,h,c,hi],k)=>{
    blob(cx, dt0(cx)-(k>=4?5:0), w, h, c, hi); });
  blob(67, dt0(67)-10, 9, 6, '#23262b', '#4a515a');
  blob(75, dt0(75)-11, 6, 5, '#2f4a2a', '#4f7046');
  // pizza box, crate, banana peel, fish bones, tire
  for(let x=58;x<=64;x++){ px(x, dt0(x)-11, '#d9b778'); px(x, dt0(x)-12, x%3?'#c9a465':'#b8382a'); }
  for(let x=84;x<=89;x++) for(let r=6;r<=10;r++) px(x, dt0(x)-r, (r===8||x===84||x===89)?'#7a5028':'#a0703a');
  px(71,dt0(71)-16,'#ffe14d'); px(70,dt0(71)-15,'#ffe14d'); px(72,dt0(71)-15,'#ffe14d'); px(69,dt0(71)-14,'#c9b02a'); px(73,dt0(71)-14,'#c9b02a');
  for(let x=78;x<=83;x++) px(x, dt0(78)-13, '#e8e0c8');
  px(78,dt0(78)-14,'#e8e0c8'); px(78,dt0(78)-12,'#e8e0c8'); px(80,dt0(78)-14,'#e8e0c8'); px(80,dt0(78)-12,'#e8e0c8'); px(82,dt0(78)-14,'#e8e0c8'); px(82,dt0(78)-12,'#e8e0c8'); px(84,dt0(78)-13,'#e8e0c8');
  for(let y=-2;y<=2;y++) for(let x=-2;x<=2;x++){ const d=x*x+y*y; if(d>=2&&d<=5) px(52+x, dt0(52)-3+y, '#1c1c1c'); }
  if(S.sink<.15){
    // stink lines
    for(let i=0;i<5;i++){
      const bx = 58 + i*7, by = dt0(bx) - 14 - (i%2)*3;
      for(let y=0;y<10;y+=1){ if((y + Math.floor(T*10)) % 3 === 0) continue;
        px(bx + Math.round(Math.sin(T*4 + y*.7 + i*1.7)*1.6), by - y, y<5 ? '#9bd65c' : '#c4ec8c'); }
    }
    // flies
    for(let i=0;i<5;i++){
      const fx = 72 + Math.cos(T*(6+i) + i*2.1)*14, fy = dt0(72) - 16 + Math.sin(T*(8+i*.7) + i)*6;
      px(fx, fy, '#111'); if(Math.floor(T*20+i)%2) px(fx+1, fy-1, '#c8d2dc');
    }

  // leaning flag pole with a tattered flag
  const fb = deckTop(94)-1;

  }
}

  const j = S.jerk, bd = S.bend;
  const tx = Math.round(bx+30 - 9*j - 3*bd), ty = Math.round(by-24 - 9*j + 14*bd);
  const cx = (bx+tx)/2 + 2*bd, cy = (by+ty)/2 + 8*bd - 2*j;
  let lx = bx, ly = by, hand2 = null;
  for(let i=1;i<=40;i++){
    const t = i/40, u = 1-t;
    const x = u*u*bx + 2*u*t*cx + t*t*tx, y = u*u*by + 2*u*t*cy + t*t*ty;
    line(lx,ly,x,y,()=> t<.55 ? '#5a3418' : '#8a5a2a');
    if(i===8) hand2 = {x:Math.round(x), y:Math.round(y)};
    lx=x; ly=y;
  }
  px(tx,ty,'#ff3d3d');
  // reel + spinning crank handle
  const rx = bx+1, ry = by+1;
  rect(rx-1,ry-1,3,3,'#9aa6b2'); px(rx,ry,'#5d6b7a');
  const kx = rx + Math.round(Math.cos(S.crankA)*2.6), ky = ry + Math.round(Math.sin(S.crankA)*2.6);
  // arms
  line(sx,sy,hand2.x,hand2.y,()=> '#e8c23a'); px(hand2.x,hand2.y,'#f2b48a');
  line(sx,sy+1,kx,ky,()=> '#d4ae2a'); px(kx,ky,'#f2b48a');
  return { tx, ty };
}

function drawHook(x,y){ px(x,y+1,'#cfd8e0'); px(x,y+2,'#cfd8e0'); px(x-1,y+3,'#cfd8e0'); px(x-2,y+2,'#cfd8e0'); }
function draw(){
  drawWorld();
  swimmers.forEach(e=>{ if(e.type==='whale') drawEntity(e); });
  swimmers.forEach(e=>{ if(e.type!=='whale') drawEntity(e); });
  bubbles.forEach(o=>{ px(o.x,o.y,'#d6f6ff'); });
  drawBarge();
  const {fx, fy} = drawMan();
  const {tx:tipX, ty:tipY} = drawRodAndArms(fx, fy);
  const sway = S.hookY>WY && !S.hooked ? Math.round(Math.sin(S.T*1.4)) : 0;
  const hookX = tipX + sway;
  S.tipX = tipX;
  if(S.noLine){ /* the line went down with the ship */ }
  else if(S.snap){
    const p = S.snap.p, endY = tipY + (S.snap.y - tipY)*(1-p)*.5;
    if(endY>tipY+1) line(tipX,tipY,tipX+Math.round(p*3),endY,lineCol);
    const lx = S.snap.x + p*8, ly = S.snap.y + p*16;
    line(lx,ly-6,lx,ly,lineCol); drawHook(lx,ly);
  } else {
    line(tipX,tipY,hookX,S.hookY,lineCol);
    drawHook(hookX,S.hookY);
    const hung = S.hooked || S.bait;
    if(hung){
      const k = KIND[hung.type];
      if(k.hang==='c'){ hung.dir = 1; hung.x = hookX-(hung.w>>1); hung.y = S.hookY+1; }
      else if(hung.type==='fish'){
        hung.dir = S.hooked ? (Math.sin(S.T*14)>0?1:-1) : 1;
        hung.x = hung.dir>0 ? hookX-hung.w : hookX+1;
        hung.y = S.hookY + 2 - (hung.h>>1);
      } else {
        hung.dir = 1; hung.x = hookX-hung.w+(S.hooked?Math.round(Math.sin(S.T*25)):0);
        hung.y = S.hookY + 2 - (hung.h>>1);
      }
      drawEntity(hung);
    }
  }
  if(S.flying) drawEntity(S.flying);
  if(S.sink>0){
    ctx.globalAlpha = Math.min(.55, S.sink*1.1);
    const bot = Math.min(H, deckTop(BX1)+40);
    rect(0, WY+1, W, bot-WY-1, '#1a3f8f');
    ctx.globalAlpha = 1;
  }
}

// ---------- loop + tweens ----------
const tweens = [];
const animate = (d,fn)=>new Promise(res=>tweens.push({d,t:0,fn,res}));
const wait = s=>animate(s,()=>{});
const ease = p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
let last = performance.now(), bubbleT = 0;
const G = { timer:null };
function frame(now){
  const dt = Math.max(0, Math.min(.05,(now-last)/1000)); last = now; S.T += dt;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; tw.fn(Math.min(1,tw.t/tw.d)); if(tw.t>=tw.d){ tweens.splice(i,1); tw.res(); } }
  for(let i=swimmers.length-1;i>=0;i--){
    const f=swimmers[i];
    let v = f.speed;
    if(f.type==='squid' && !f.flee) v *= .3 + Math.max(0, Math.sin(f.phase*.5))*1.8;
    f.x += v*f.dir*dt; f.phase += dt*(f.type==='fish' ? 4+f.speed/3 : 6);
    if(f.bob) f.y = f.y0 + Math.round(Math.sin(S.T*2+f.ph0)*f.bob);
    if((f.dir>0 && f.x>W+4) || (f.dir<0 && f.x<-f.w-4)){ swimmers.splice(i,1); if(!f.flee) spawn(f.type); }
  }
  if(S.hooked) S.hooked.phase += dt*18;
  if(S.pile>0) S.pile -= dt;
  bubbleT -= dt;
  if(bubbleT<=0){ bubbleT = .5+Math.random()*.8; const xs=[14,26,148,176,100]; bubbles.push({x:xs[Math.floor(Math.random()*xs.length)], y:SANDY-4, v:10+Math.random()*8}); }
  for(let i=bubbles.length-1;i>=0;i--){ const o=bubbles[i]; o.y-=o.v*dt; o.x += Math.sin(S.T*3+i)*.15; if(o.y<WY+1) bubbles.splice(i,1); }
  if(G.timer){ G.timer.el += dt; G.timer.tick(); if(G.timer && G.timer.el>=G.timer.limit) G.timer.end(); }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- rod animations ----------
function lowerTo(y, d=1.1){ const y0=S.hookY; return animate(d, p=>{ S.hookY = y0+(y-y0)*ease(p); S.crankA -= .25; }); }
async function jerk(){
  await animate(.34, p=>{ const s = Math.sin(p*Math.PI); S.jerk = s; S.lean = s; S.shake = s; });
  S.jerk = 0; S.lean = 0; S.shake = 0;
}
// Hard cranking: the line moves in bursts, the rod loads up and he heaves back on every turn.
async function crank(y1, d, load){
  const y0 = S.hookY, n = Math.max(2, Math.round(d*3.2));
  await animate(d, p=>{
    const q = p - Math.sin(2*Math.PI*n*p)/(2*Math.PI*n);
    const pulse = (1 - Math.cos(2*Math.PI*n*p))/2;
    S.hookY = y0 + (y1-y0)*q;
    S.crankA = 2*Math.PI*n*p;
    S.bend = load ? .45 + .55*pulse : .15*pulse;
    S.lean = load ? .35 + .65*pulse : .35*pulse;
    S.shake = load ? pulse : 0;
  });
  S.bend = 0; S.lean = 0; S.shake = 0;
}
async function flyToPile(f){
  S.hooked = null; S.flying = f; f.dir = -1;
  const sx=f.x, sy=f.y, tx=66-(f.w>>1), ty=deckTop(66)-6-f.h;
  await animate(.6, p=>{ f.x = sx+(tx-sx)*p; f.y = sy+(ty-sy)*p - Math.sin(p*Math.PI)*16; });
  S.flying = null; S.pile = .3;
}
async function catchIt(type, o={}){
  S.bait = null;
  await jerk();
  const f = makeCreature(type, o); S.hooked = f;
  await crank(HANG, o.slow ? 2.2 : 1.4, true);
  await flyToPile(f);
  return f;
}
async function catchTrash(type){
  await jerk();
  await crank(WY+1, 1.0, false);
  const i = swimmers.findIndex(s=>s.type===type && !s.flee);
  if(i>=0){ swimmers.splice(i,1); spawn(type); }
  S.hooked = makeCreature(type);
  await crank(HANG, .5, true);
  await flyToPile(S.hooked);
}
async function catchWhale(bet){
  S.bait = null;
  await jerk();
  const f = makeCreature('whale', { scale:2 }); S.hooked = f;
  await crank(HANG, 2.4, true);
  S.hooked = null; S.flying = f; f.dir = -1; S.noLine = true;
  const sx = f.x, sy = f.y, tx = 70-(f.w>>1);
  await animate(.7, p=>{ const ty = deckTop(70)-f.h+5; f.x = sx+(tx-sx)*p; f.y = sy+(ty-sy)*p - Math.sin(p*Math.PI)*22; });
  const off = f.y - deckTop(70);
  await animate(2.8, p=>{
    S.sink = ease(p); S.shake = p<.35 ? 1 : 0;
    f.y = deckTop(70) + off;
    if(Math.random()<.5) bubbles.push({ x:rnd(30,140), y:deckTop(80)+4, v:14+Math.random()*12 });
  });
  S.shake = 0; hideBanner();
  $('fatalPts').textContent = `+${fmt(bet*2)} POINTS`;
  updateScore(); const sc = document.querySelector('.score'); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
  $('scene').classList.add('wasted'); $('fatal').classList.add('on');
  await wait(3.2);
}
async function snapLine(type){
  await jerk();
  const f = S.bait || makeCreature(type); S.bait = null;
  f.x = (S.tipX || 150) - f.w; f.y = S.hookY - (f.h>>1); f.dir = 1; f.speed = 70; f.flee = true; f.bob = 0;
  swimmers.push(f);
  S.snap = { x:S.tipX || 150, y:S.hookY, p:0 };
  await animate(1.0, p=>S.snap.p=p);
  S.snap = null; S.hookY = HANG;
}

// how-many slider
const sig3 = v=>{ if(v<1000) return Math.round(v); const p = Math.pow(10, Math.floor(Math.log10(v))-2); return Math.round(v/p)*p; };
function closeness(g, a){
  if(g==null || g<=0) return 0;
  const r = Math.max(g/a, a/g);
  if(r<=1.05) return 1; if(r>=2) return 0;
  return 1 - (Math.log(r)-Math.log(1.05))/(Math.log(2)-Math.log(1.05));
}
function askSlider(q, limit, eyebrow){
  return new Promise(res=>{
    const lin = !q.log, step = q.step||1;
    const toVal = v=> lin ? Math.round(+v/step)*step : sig3(Math.exp(Math.log(q.min)+(Math.log(q.max)-Math.log(q.min))*v/1000));
    const start = lin ? Math.round((q.min+q.max)/2/step)*step : 500;
    panel.innerHTML =
      `<div class="eyebrow">${eyebrow}</div>${timerHTML}
       <p class="q">${q.q}</p>
       <div class="guess"><b id="gv"></b><span class="muted">${q.unit}</span></div>
       <input class="range" type="range" id="sl" min="${lin?q.min:0}" max="${lin?q.max:1000}" step="${lin?step:1}" value="${start}" aria-label="Your guess in ${q.unit}">
       <div class="ends"><span>${fmt(q.min)}</span><span>${fmt(q.max)}</span></div>
       <div class="nudge"><button class="nb" id="minus" aria-label="Lower">−</button><button class="btn" id="lock">Lock it in</button><button class="nb" id="plus" aria-label="Higher">+</button></div>
       <p class="muted" id="ansline"></p>
       <p class="feedback" id="fb"></p>`;
    const sl=$('sl'), gv=$('gv'); let touched=false, done=false;
    const show = ()=>{ gv.textContent = fmt(toVal(sl.value)); };
    const nudge = d=>{ touched = true; sl.value = Math.min(+sl.max, Math.max(+sl.min, +sl.value + d*(lin?step:8))); show(); };
    sl.oninput = ()=>{ touched = true; show(); };
    $('minus').onclick = ()=>nudge(-1); $('plus').onclick = ()=>nudge(1);
    show();
    const finish = timedOut=>{
      if(done) return; done = true; G.timer = null;
      sl.disabled = true; ['minus','plus','lock'].forEach(id=>$(id).disabled = true);
      res({ guess: (timedOut && !touched) ? null : toVal(sl.value) });
    };
    $('lock').onclick = ()=>finish(false);
    startTimer(limit, ()=>finish(true));
  });
}

// one-word answer with spelling help
const norm = s=>s.toLowerCase().replace(/[^a-z]/g,'');
const tol = a=> a.length<=4 ? 1 : 2;
function dist(a,b,max){
  const n=a.length, m=b.length; if(Math.abs(n-m)>max) return max+1;
  let pp=null, p=new Array(m+1); for(let j=0;j<=m;j++) p[j]=j;
  for(let i=1;i<=n;i++){
    const c=new Array(m+1); c[0]=i; let best=i;
    for(let j=1;j<=m;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      let v = Math.min(p[j]+1, c[j-1]+1, p[j-1]+cost);
      if(pp && i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v = Math.min(v, pp[j-2]+1);
      c[j]=v; if(v<best) best=v;
    }
    if(best>max) return max+1; pp=p; p=c;
  }
  return p[m];
}
function suggest(inp, sg){
  const w = norm(inp.value);
  if(w.length<3 || WORDSET.has(w)){ sg.innerHTML=''; return; }
  const max = w.length<=4 ? 1 : 2, out = [];
  for(let i=0;i<WORDS.length;i++){
    const c = WORDS[i]; if(Math.abs(c.length-w.length)>max) continue;
    const d = dist(w,c,max); if(d<=max) out.push([d,i,c]);
  }
  out.sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
  const top = out.slice(0,3);
  if(!top.length){ sg.innerHTML=''; return; }
  sg.innerHTML = '<span>Did you mean</span>' + top.map(t=>`<button type="button" class="chip">${t[2]}</button>`).join('');
  sg.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ inp.value = b.textContent; sg.innerHTML=''; inp.focus(); });
}
function askWord(q, limit, eyebrow){
  return new Promise(res=>{
    panel.innerHTML =
      `<div class="eyebrow">${eyebrow}</div>${timerHTML}
       <p class="q clue">${q.clue}</p>
       <p class="muted">One word. Spelling doesn't count.</p>
       <form class="word" id="wf"><input id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" maxlength="30" aria-label="Your answer"><button class="btn" type="submit">Reel</button></form>
       <div class="sugg" id="sugg" aria-live="polite"></div>
       <p class="feedback" id="fb"></p>`;
    const inp=$('ans'), sg=$('sugg'); let done=false, deb;
    inp.oninput = ()=>{ clearTimeout(deb); deb = setTimeout(()=>suggest(inp,sg), 140); };
    const finish = ()=>{
      if(done) return; done = true; G.timer = null; clearTimeout(deb);
      inp.disabled = true; panel.querySelector('#wf button').disabled = true; sg.innerHTML = '';
      const v = norm(inp.value);
      res({ text: inp.value.trim(), correct: v.length>0 && q.ans.some(a=>dist(v,a,tol(a))<=tol(a)) });
    };
    $('wf').onsubmit = e=>{ e.preventDefault(); finish(); };
    startTimer(limit, finish);
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
  });
}

// ---------- game state ----------
let R;
function fresh(){ R = { catches:[], r1:[], r2:[], bottom:null }; S.hookY = HANG; S.bait=null; S.hooked=null; S.flying=null; S.sink=0; S.noLine=false;
  $('scene').classList.remove('wasted'); $('fatal').classList.remove('on'); updateScore(); }
function baseSum(round){ return R.catches.filter(c=>c.round===round).reduce((s,c)=>s+c.base,0); }
function bottomDelta(){ const b=R.bottom; if(!b) return 0; if(b.type==='hook') return b.win?100:0; return b.win ? 2*b.bet : -b.bet; }
function total(){ return baseSum(1)+baseSum(2)+bottomDelta(); }
function updateScore(){ $('hudScore').textContent = fmt(total()); }

async function toDepth(d, i){
  if(Math.abs(S.hookY-DEPTH[d])>1){
    waiting(i===0 ? ['Round 1','Round 2','Final round'][d] : 'Master Baiter');

  }

}
async function junk(lead){

}

async function round1(){

  const list = DAY.r2;

    const q = list[i];
    const r = await askSlider(q, 20, `Mid-water · ${i+1} of ${list.length} · How many?`);

      feedback(`${c===1?'Bullseye! ':''}${Math.round(c*100)}% close. ${KIND[type].name} on! +${pts}`, true);

async function round3(){

  if(pick3>=0){
    const c = R.catches[pick3];
    S.bait = makeCreature(c.type, { col:c.col, pal:c.pal });
    waiting('Final round');
    await lowerTo(DEPTH[2], 1.4); hideBanner();
    const q = DAY.r3main;
    const r = await askWord(q, 30, `Bottom · Bait: ${c.name}, ${c.base} pts`);
    if(r.correct){
      const prize = c.base<=150 ? 'crab' : (c.base<=250 ? 'squid' : 'whale');
      R.bottom = { type:'bait', win:true, bet:c.base, prize };
      feedback(`${q.show}! A ${KIND[prize].name}! +${fmt(c.base*2)} (bait tripled to ${fmt(c.base*3)})`, true);
      banner(KIND[prize].name.toUpperCase()+'!'); praise();
      if(prize==='whale') await catchWhale(c.base); else await catchIt(prize, { scale:2, slow:true });
    } else {
      R.bottom = { type:'bait', win:false, bet:c.base };
      feedback(`Snap! It was ${q.show}. Your bait swam off with ${c.base} pts.`, false);
      banner('SNAP!', true);
      await snapLine('squid');
    }
  } else {
    waiting('Dropping a bare hook to the bottom…');
    await lowerTo(DEPTH[2], 1.4); hideBanner();
    const q = DAY.r3main;
    const r = await askWord(q, 30, 'Bottom · Bare hook');
    R.bottom = { type:'hook', win:r.correct, bet:0, prize:'crab' };
    if(r.correct){ feedback(`${q.show}! A little crab grabbed on. +100`, true); praise(); await catchIt('crab'); }
    else { feedback(`Snap! It was ${q.show}. Nothing lost.`, false); banner('SNAP!', true); await snapLine('squid'); }
  }
  updateScore();
  await wait(1.2); hideBanner();
}

function shareText(res){
  return `The Daily Crank #${DAYNUM} 🎣\nSurface:  ${res.r1.join('')}\nMid:      ${res.r2.join('')}\nBottom:   ${res.bottomEmoji}\nScore: ${fmt(res.score)}\ncrankreports.com/thedailycrank`;
}

async function play(){
  fresh(); $('daySel').disabled = true;
  banner('ROUND 1 · SURFACE');
  await round1();
  banner('ROUND 2 · MID-WATER');
  await round2();
  await round3();
  const b = R.bottom;
  const res = {
    score: total(), r1:R.r1, r2:R.r2,
    s1: baseSum(1), s2: baseSum(2), d3: bottomDelta(),
    bottomEmoji: b.win ? ({crab:'🦀', squid:'🦑', whale:'🐋💀'})[b.prize] : '❌',
    bottomNote: b.type==='hook' ? (b.win?'Bare hook catch':'Bare hook, no catch') : (b.win ? (b.prize==='whale' ? 'Bait tripled. Caught whale, sank barge.' : 'Bait tripled') : 'Bait lost'),
  };
  store.set(res);
  results(res);
}

let cdTimer;
function results(res){
  $('daySel').disabled = false;
  $('hudScore').textContent = fmt(res.score);
  const sign = n=> n>0?'+'+fmt(n):(n<0?'−'+fmt(-n):'0');
  const text = shareText(res);
  panel.innerHTML =
    `<div class="eyebrow">Back at the dock · #${DAYNUM}</div>
     <div class="total"><span class="big">${fmt(res.score)}</span><span class="muted">points</span></div>
     <dl class="haul">
       <div><dt>Surface</dt><dd class="e">${res.r1.join('')}</dd><dd class="n">${fmt(res.s1)}</dd></div>
       <div><dt>Mid</dt><dd class="e">${res.r2.join('')}</dd><dd class="n">${fmt(res.s2)}</dd></div>
       <div><dt>Bottom</dt><dd class="e">${res.bottomEmoji} <span class="muted">${res.bottomNote}</span></dd><dd class="n">${sign(res.d3)}</dd></div>
     </dl>
     <pre class="share" id="shareText">${text}</pre>
     <button class="btn" id="copyBtn">Copy result</button>
     <p class="feedback good" id="copyMsg" aria-live="polite"></p>
     <p class="muted">Next trip in <span id="cd"></span></p>
     ${TEST ? '<button class="link" id="again">Fish again (prototype only)</button>' : ''}`;
  $('copyBtn').onclick = ()=>{
    const msg = $('copyMsg');
    const fallback = ()=>{ const r=document.createRange(); r.selectNodeContents($('shareText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent='Selected. Press Copy on your device.'; };
    try { navigator.clipboard.writeText(text).then(()=>msg.textContent='Copied! Paste it in a text or post.', fallback); } catch(e){ fallback(); }
  };
  if($('again')) $('again').onclick = ()=>{ store.clear(); clearInterval(cdTimer); play(); };
  const tick = ()=>{ const n=new Date(); const m=new Date(n); m.setHours(24,0,0,0); const s=Math.floor((m-n)/1000); const el=$('cd'); if(el) el.textContent = `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`; };
  tick(); clearInterval(cdTimer); cdTimer = setInterval(tick, 30000);
}

function start(){
  panel.innerHTML =
    `<div class="eyebrow">Today's trip · 9 questions · about 4 minutes</div>
     <h2>Start your day with a crank</h2>
     <ol class="rounds">
       <li><b>Surface</b><span>5 rapid-fire questions. 10 seconds each. Miss and you reel up garbage.</span></li>
       <li><b>Mid-water</b><span>3 "how many" questions. Slide to your guess. The closer you are, the bigger the fish.</span></li>
       <li><b>Bottom</b><span>Bet a fish on a one-word clue. Win and it triples. Spelling doesn't count.</span></li>
     </ol>
     <button class="btn" id="go">Crank</button>`;
  $('go').onclick = play;
}

const TEST = /[?&]test\b/.test(location.search);
if(!TEST) $('testTools').hidden = true;
const daySel = $('daySel');
daySel.innerHTML = DAY_KEYS.map(k=>`<option value="${k}">${new Date(k+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</option>`).join('');
daySel.value = dayKey;
function boot(){ fresh(); const saved = store.get(); if(saved) results(saved); else start(); }
daySel.onchange = ()=>{ clearInterval(cdTimer); setDay(daySel.value); boot(); };
boot();
})();
</script>
