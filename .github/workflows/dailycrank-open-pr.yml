name: Daily Crank open PR

# When the nightly run pushes a daily-crank/<day> branch, open its PR as the
# Crank Bot GitHub App, so either editor can approve it (GitHub never lets a
# PR's author approve it). The PR title and description come from the
# branch's latest commit: its first line and its body.
#
# Needs the app's ID in the GOD_CRANK_APP_ID repo variable (not secret: it only
# identifies the app) and its private key in the GOD_CRANK_SECRET repo secret. Setup steps are in
# pipeline/dailycrank/README.md.
#
# To open a PR for a branch that was already pushed (say, if this workflow
# failed), use Actions -> Daily Crank open PR -> Run workflow and give the
# branch name.
on:
  push:
    branches:
      - "daily-crank/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to open a PR for, e.g. daily-crank/2026-11-11"
        required: true

permissions:
  contents: read

concurrency:
  group: dailycrank-open-pr-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Check the branch name
        run: |
          case "$BRANCH" in
            daily-crank/*) ;;
            *) echo "Only daily-crank/<day> branches get a PR here, not '$BRANCH'."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Act as Crank Bot
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GOD_CRANK_APP_ID }}
          private-key: ${{ secrets.GOD_CRANK_SECRET }}

      - name: Open the PR unless one is already open
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != "0" ]; then
            echo "A PR for $BRANCH is already open; leaving it alone."
            exit 0
          fi
          git log -1 --format=%s > "$RUNNER_TEMP/title.txt"
          git log -1 --format=%b > "$RUNNER_TEMP/body.md"
          if [ ! -s "$RUNNER_TEMP/body.md" ]; then
            echo "Pushed by the Daily Crank pipeline. (The commit had no description.)" > "$RUNNER_TEMP/body.md"
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --body-file "$RUNNER_TEMP/body.md"
