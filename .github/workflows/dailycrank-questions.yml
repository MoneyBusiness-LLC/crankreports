name: Daily Crank questions

# API-key version of the pipeline: drafts a day and opens a PR for review.
# Merging the PR publishes the day. Needs the ANTHROPIC_API_KEY repo secret.
# Nightly runs currently come from a Claude Code scheduled task (see RUNBOOK.md),
# so this only runs by hand. To switch back, restore a schedule such as:
#   schedule:
#     - cron: "1 8 * * *"   # UTC: 12:01am Pacific in winter, 1:01am in summer
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to write, YYYY-MM-DD. Leave blank for today (Pacific time)."
        required: false
      theme:
        description: "Optional theme, e.g. 'Election results' or 'Thanksgiving'."
        required: false
      replace:
        description: "Redraft even if the day exists. Overwrites any edits on that day's PR branch."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dailycrank-questions
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/dailycrank/requirements.txt

      - name: Draft the day
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE: ${{ inputs.date }}
          THEME: ${{ inputs.theme }}
          REPLACE: ${{ inputs.replace }}
        run: |
          args=(--out "$RUNNER_TEMP/dc")
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ -n "$THEME" ]; then args+=(--theme "$THEME"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          python pipeline/dailycrank/generate.py "${args[@]}"

      - name: Open or update the PR
        if: steps.gen.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.gen.outputs.day }}
        run: |
          branch="daily-crank/$DAY"
          title="Daily Crank: $(date -d "$DAY" '+%a %b %-d') questions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add thedailycrank/questions.json
          git commit -m "$title" -m "Drafted by the question pipeline. Sources and fact-checks are in the PR description."
          git push --force -u origin "$branch"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/dc/pr_body.md"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/dc/pr_body.md"
          fi

      - name: Keep the drafts and fact-checks
        if: always() && steps.gen.outputs.day != ''
        uses: actions/upload-artifact@v4
        with:
          name: dailycrank-${{ steps.gen.outputs.day }}
          path: ${{ runner.temp }}/dc
          if-no-files-found: ignore
