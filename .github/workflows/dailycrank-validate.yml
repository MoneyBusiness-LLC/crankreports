name: Daily Crank checks

# Checks upcoming days in questions.json against the game's rules on every PR that touches them.
on:
  pull_request:
    paths:
      - "thedailycrank/questions.json"
      - "pipeline/dailycrank/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/dailycrank/validate.py
